<h1>Login seguro!</h1>

<form (ngSubmit)="login()">
    <div class="campos_input" id="campos_input_email">
        <label for="input__email">Digite seu email</label>
        <input
            type="text"
            name="email"
            id="input__email"
            placeholder="email@email.com"
            [(ngModel)]='email'
            required>
    </div>
    
    <div class="campos_input" id="campos_input_senha">
        <label for="input__senha">Digite sua senha</label>
        <input
            type="password"
            name="senha"
            id="input__senha"
            placeholder="********"
            [(ngModel)]="senha"
            required>
    </div>

    <button type="submit" class="button_login">Entrar</button>
</form>

<div class="links">
    <a href="">Esqueci minha senha.</a>
    <a href="">Criar minha conta.</a>
</div>
